<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting Adventure: Berhitung Seru Anak TK!</title>
    <!-- Memuat Library Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Bubblegum Sans', cursive, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 650px;
            width: 100%;
            text-align: center;
            border: 5px solid #0984e3;
            position: relative;
        }

        h1 {
            color: #0984e3;
            font-size: 26px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px #ffeaa7;
        }

        p.instruction {
            color: #555;
            font-size: 16px;
            margin-bottom: 15px;
        }

        /* Overlay Tombol Play Awal */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #start-overlay h2 {
            color: #0984e3;
            font-size: 30px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #ffeaa7;
        }

        #play-btn {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 184, 148, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        #play-btn:hover {
            background-color: #00cec9;
            transform: scale(1.05);
        }

        /* Area Pertanyaan / Soal */
        .question-box {
            background: #f1f2f6;
            border: 3px dashed #747d8c;
            border-radius: 20px;
            padding: 20px;
            min-height: 160px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .item-icon {
            font-size: 45px;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Pilihan Gambar Jari (Opsi Jawaban) */
        .options-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .option-btn {
            background-color: #ffeaa7;
            border: 4px solid #fdcb6e;
            width: 75px;
            height: 75px;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 6px;
        }

        .option-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
            pointer-events: none;
        }

        .option-btn:hover {
            background-color: #fdcb6e;
            transform: scale(1.08);
        }

        .option-btn.correct {
            background-color: #00b894 !important;
            border-color: #00cec9 !important;
            transform: scale(1.1);
        }

        .option-btn.wrong {
            background-color: #ff7675 !important;
            border-color: #d63031 !important;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* Status & Level Info */
        .game-info {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: #2d3436;
            margin-top: 15px;
            padding: 0 10px;
        }

        /* Feedback Pesan Benar/Salah di Soal */
        #feedback-text {
            font-size: 20px;
            font-weight: bold;
            height: 30px;
            margin-bottom: 10px;
        }

        /* Tombol Main Lagi / Lanjut */
        #next-btn {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(9, 132, 227, 0.4);
            display: none;
            transition: background 0.2s;
        }

        #next-btn:hover {
            background-color: #74b9ff;
        }
    </style>
</head>
<body>

    <!-- Musik Latar & Musik Selesai -->
    <audio id="bg-music" src="https://files.catbox.moe/a742my.mp3" preload="auto" loop></audio>
    <audio id="win-music" src="https://files.catbox.moe/wsohm6.mp3" preload="auto"></audio>

    <div class="game-container">
        <!-- Overlay Tombol Play Awal -->
        <div id="start-overlay">
            <h2>🎒 Counting Adventure 🔢</h2>
            <button id="play-btn" onclick="startGame()">Mulai Main 🚀</button>
        </div>

        <h1>⭐ Petualangan Berhitung ⭐</h1>
        <p class="instruction">Hitung ada berapa banyak benda!</p>

        <div class="game-info">
            <div>Soal ke: <span id="current-level">1</span> / 5</div>
            <div>Skor: <span id="score">0</span></div>
        </div>

        <div id="feedback-text"></div>

        <!-- Kotak Tempat Objek yang Dihitung -->
        <div class="question-box" id="question-box">
            <!-- Icon benda akan di-generate di sini -->
        </div>

        <!-- Pilihan Gambar Jari -->
        <div class="options-container" id="options-container">
            <!-- Tombol pilihan jari tangan -->
        </div>

        <button id="next-btn" onclick="nextQuestion()">Lanjut Soal Berikutnya ➡️</button>
    </div>

    <script>
        // Data master level permainan
        const masterLevels = [
            { emoji: '🍎', name: 'Apel', count: 3 },
            { emoji: '🐱', name: 'Kucing', count: 5 },
            { emoji: '⭐', name: 'Bintang', count: 2 },
            { emoji: '🚗', name: 'Mobil', count: 4 },
            { emoji: '🎈', name: 'Balon', count: 6 }
        ];

        let activeLevels = [];

        // Pemetaan tautan gambar jari sesuai permintaan (Angka 2 sampai 6)
        const optionDetails = {
            2: '<img src="https://i.ibb.co.com/svqqSdJr/2.jpg" alt="Jari 2">',
            3: '<img src="https://i.ibb.co.com/QvvKHNQs/3.jpg" alt="Jari 3">',
            4: '<img src="https://i.ibb.co.com/847yYNx5/4.jpg" alt="Jari 4">',
            5: '<img src="https://i.ibb.co.com/TxJdJJwJ/5.jpg" alt="Jari 5">',
            6: '<img src="https://i.ibb.co.com/MxLDydC6/6.jpg" alt="Jari 6">'
        };

        let currentLevelIndex = 0;
        let score = 0;
        let canAnswer = true;

        const startOverlay = document.getElementById('start-overlay');
        const questionBox = document.getElementById('question-box');
        const optionsContainer = document.getElementById('options-container');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('current-level');
        const feedbackText = document.getElementById('feedback-text');
        const nextBtn = document.getElementById('next-btn');
        const bgMusic = document.getElementById('bg-music');
        const winMusic = document.getElementById('win-music');

        function startGame() {
            startOverlay.style.display = 'none';
            bgMusic.currentTime = 0;
            bgMusic.play().catch(() => {});
            initGame();
        }

        function initGame() {
            currentLevelIndex = 0;
            score = 0;
            scoreDisplay.textContent = score;
            winMusic.pause();
            winMusic.currentTime = 0;
            
            // Acak urutan soal (randomize levels) setiap game dimulai atau di-restart
            activeLevels = [...masterLevels].sort(() => Math.random() - 0.5);

            loadLevel();
        }

        function loadLevel() {
            canAnswer = true;
            feedbackText.textContent = '';
            nextBtn.style.display = 'none';
            levelDisplay.textContent = currentLevelIndex + 1;
            questionBox.innerHTML = '';
            optionsContainer.innerHTML = '';

            const currentObj = activeLevels[currentLevelIndex];

            // Render objek sejumlah count
            for (let i = 0; i < currentObj.count; i++) {
                const span = document.createElement('span');
                span.classList.add('item-icon');
                span.textContent = currentObj.emoji;
                questionBox.appendChild(span);
            }

            // Buat pilihan angka acak (pastikan jawaban benar masuk ke dalam opsi)
            let choices = [currentObj.count];
            while (choices.length < 4) {
                let randomNum = Math.floor(Math.random() * 5) + 2; // angka 2 sampai 6
                if (!choices.includes(randomNum)) {
                    choices.push(randomNum);
                }
            }
            // Acak urutan tombol pilihan
            choices.sort(() => Math.random() - 0.5);

            // Render tombol pilihan opsi (gambar jari tangan)
            choices.forEach(num => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                
                if (optionDetails[num] !== undefined) {
                    btn.innerHTML = optionDetails[num];
                } else {
                    btn.textContent = num;
                }

                btn.onclick = () => checkAnswer(num, currentObj.count, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedNum, correctNum, btnElement) {
            if (!canAnswer) return;
            canAnswer = false;

            if (selectedNum === correctNum) {
                btnElement.classList.add('correct');
                feedbackText.textContent = '🎉 Hebat! Jawabanmu Benar!';
                feedbackText.style.color = '#00b894';
                score += 20;
                scoreDisplay.textContent = score;

                if (currentLevelIndex < activeLevels.length - 1) {
                    nextBtn.textContent = 'Lanjut Soal Berikutnya ➡️';
                    nextBtn.style.display = 'inline-block';
                } else {
                    endGame();
                }
            } else {
                btnElement.classList.add('wrong');
                feedbackText.textContent = '❌ Ups, coba hitung lagi ya!';
                feedbackText.style.color = '#d63031';

                if (currentLevelIndex < activeLevels.length - 1) {
                    nextBtn.textContent = 'Lanjut Soal Berikutnya ➡️';
                    nextBtn.style.display = 'inline-block';
                } else {
                    endGame();
                }
            }
        }

        function nextQuestion() {
            currentLevelIndex++;
            loadLevel();
        }

        function endGame() {
            feedbackText.textContent = '🌟 Hore! Kamu Menyelesaikan Petualangan Berhitung! 🌟';
            feedbackText.style.color = '#0984e3';
            nextBtn.textContent = 'Main Lagi 🔄';
            nextBtn.onclick = () => {
                winMusic.pause();
                winMusic.currentTime = 0;
                bgMusic.currentTime = 0;
                bgMusic.play().catch(() => {});
                initGame(); // Mengacak ulang urutan soal saat klik Main Lagi
                nextBtn.onclick = nextQuestion;
            };
            nextBtn.style.display = 'inline-block';

            // Matikan musik latar, nyalakan musik menang & efek confetti
            bgMusic.pause();
            winMusic.currentTime = 0;
            winMusic.play().catch(() => {});

            confetti({
                particleCount: 200,
                spread: 100,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
